<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل دخول الإدارة | أثر ATHAR</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23264A43'/%3E%3Cpath fill='%23B89A5E' d='M50 28c10 0 18 8 18 18 0 8-5 14.6-12.5 17.3 4.5-1.1 8-5.2 8-10.3 0-5.7-4.6-10.3-10.3-10.3-4.6 0-8.4 3.2-9.8 7.4-1.1 3 0 6.4 2 8.6-6.8-1.6-11.4-7.7-11.4-14.9 0-10 8-18 18-18z'/%3E%3C/svg%3E" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

<div class="auth-screen">
  <div class="auth-card">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 100 100" style="width:44px;height:44px">
        <circle class="ring" cx="50" cy="50" r="46" fill="none" stroke="#B89A5E" stroke-width="1.5"/>
        <path fill="#B89A5E" stroke="none" d="M50 30c9 0 16 7 16 16 0 7-4.5 12.8-11 15.2 4-1 7-4.6 7-9.2 0-5-4-9-9-9-4 0-7.2 2.8-8.6 6.5-1 2.6-.4 5.6 1.6 7.6-6-1.4-10-6.8-10-13.1 0-8.8 7.1-16 16-16z"/>
      </svg>
      <span class="brand-word"><span class="brand-word-ar">أثر</span><span class="brand-word-en">ATHAR</span></span>
    </div>
    <h1 id="authTitle">لوحة تحكم الإدارة</h1>
    <p class="sub" id="authSub">لأصحاب المتجر المخوّلين فقط</p>

    <div class="auth-error" id="authError"></div>
    <div class="auth-error" id="authNotice" style="display:none;background:rgba(63,122,92,.12);color:#3f7a5c"></div>

    <form id="loginForm">
      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">كلمة المرور</label>
        <input type="password" id="password" required autocomplete="current-password" minlength="6">
      </div>
      <button type="submit" class="btn btn-olive btn-block" id="loginBtn">تسجيل الدخول</button>
    </form>

    <form id="signupForm" style="display:none">
      <div class="field">
        <label for="suEmail">البريد الإلكتروني</label>
        <input type="email" id="suEmail" required autocomplete="username">
      </div>
      <div class="field">
        <label for="suPassword">كلمة المرور (6 أحرف على الأقل)</label>
        <input type="password" id="suPassword" required autocomplete="new-password" minlength="6">
      </div>
      <button type="submit" class="btn btn-gold btn-block" id="signupBtn">إنشاء الحساب</button>
    </form>

    <p style="text-align:center;margin-top:var(--space-3);font-size:.85rem">
      <a href="#" id="toggleAuthMode" style="color:var(--gold-dark)"></a>
    </p>
    <p style="text-align:center;margin-top:var(--space-2);font-size:.82rem;color:var(--ink-soft)">
      <a href="../index.html" style="color:var(--gold-dark)">← العودة إلى المتجر</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="js/auth-guard.js"></script>
<script>
(function () {
  'use strict';
  document.addEventListener('DOMContentLoaded', async function () {
    // Already signed in as admin? skip straight to the dashboard.
    if (window.AtharDB && window.AtharDB.isConfigured && await window.AtharDB.auth.isAdmin()) {
      window.location.href = 'dashboard.html';
      return;
    }

    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      var errorBox = document.getElementById('authError');
      var btn = document.getElementById('loginBtn');
      errorBox.style.display = 'none';

      if (!window.AtharDB || !window.AtharDB.isConfigured) {
        errorBox.textContent = 'المتجر غير متصل بقاعدة البيانات بعد. راجعي supabase/README.md.';
        errorBox.style.display = '';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'جارٍ التحقق...';

      var email = document.getElementById('email').value.trim();
      var password = document.getElementById('password').value;
      var res = await window.AtharDB.auth.signIn(email, password);

      if (res.error) {
        errorBox.textContent = 'بيانات الدخول غير صحيحة.';
        errorBox.style.display = '';
        btn.disabled = false;
        btn.textContent = 'تسجيل الدخول';
        return;
      }

      var isAdmin = await window.AtharDB.auth.isAdmin();
      if (!isAdmin) {
        await window.AtharDB.auth.signOut();
        errorBox.textContent = 'هذا الحساب لا يملك صلاحيات الإدارة.';
        errorBox.style.display = '';
        btn.disabled = false;
        btn.textContent = 'تسجيل الدخول';
        return;
      }

      window.location.href = 'dashboard.html';
    });

    // ---- sign in / create account toggle ----
    var mode = 'login';
    var loginForm = document.getElementById('loginForm');
    var signupForm = document.getElementById('signupForm');
    var toggleLink = document.getElementById('toggleAuthMode');
    var title = document.getElementById('authTitle');
    var sub = document.getElementById('authSub');

    function renderMode() {
      var isLogin = mode === 'login';
      loginForm.style.display = isLogin ? '' : 'none';
      signupForm.style.display = isLogin ? 'none' : '';
      title.textContent = isLogin ? 'لوحة تحكم الإدارة' : 'إنشاء حساب جديد';
      sub.textContent = isLogin ? 'لأصحاب المتجر المخوّلين فقط' : 'بعد الإنشاء تحتاجين لترقية الحساب إلى مدير عبر SQL Editor';
      toggleLink.textContent = isLogin ? 'ليس لديكِ حساب؟ أنشئي حساباً' : 'لديكِ حساب بالفعل؟ سجّلي الدخول';
      document.getElementById('authError').style.display = 'none';
      document.getElementById('authNotice').style.display = 'none';
    }
    renderMode();

    toggleLink.addEventListener('click', function (e) {
      e.preventDefault();
      mode = mode === 'login' ? 'signup' : 'login';
      renderMode();
    });

    signupForm.addEventListener('submit', async function (e) {
      e.preventDefault();
      var errorBox = document.getElementById('authError');
      var noticeBox = document.getElementById('authNotice');
      var btn = document.getElementById('signupBtn');
      errorBox.style.display = 'none';
      noticeBox.style.display = 'none';

      if (!window.AtharDB || !window.AtharDB.isConfigured) {
        errorBox.textContent = 'المتجر غير متصل بقاعدة البيانات بعد. راجعي supabase/README.md.';
        errorBox.style.display = '';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'جارٍ الإنشاء...';

      var email = document.getElementById('suEmail').value.trim();
      var password = document.getElementById('suPassword').value;
      var res = await window.AtharDB.auth.signUp(email, password);

      btn.disabled = false;
      btn.textContent = 'إنشاء الحساب';

      if (res.error) {
        errorBox.textContent = 'تعذّر إنشاء الحساب: ' + res.error.message;
        errorBox.style.display = '';
        return;
      }

      signupForm.reset();
      mode = 'login';
      renderMode();
      document.getElementById('email').value = email;
      noticeBox.innerHTML = 'تم إنشاء الحساب بنجاح. الحساب الآن "عميل" عادي — لترقيته إلى مدير، ' +
        'شغّلي هذا الأمر في Supabase SQL Editor:<br><code style="direction:ltr;display:inline-block;margin-top:6px;font-size:.8rem">update public.profiles set role = \'admin\' where email = \'' +
        email.replace(/'/g, "\\'") + '\';</code><br>ثم سجّلي الدخول من هنا.';
      noticeBox.style.display = '';
    });
  });
})();
</script>
</body>
</html>
